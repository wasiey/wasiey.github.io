<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Not found · wasiey</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Source Serif 4"; src: url("/fonts/source-serif-4.woff2") format("woff2"); font-weight: 200 900; font-display: swap; }
    :root { --paper: #f5f2ea; --ink: #1c1b18; --muted: #5c5950; --red: #9a2e1c; }
    @media (prefers-color-scheme: dark) { :root { --paper: #171613; --ink: #e8e4da; --muted: #a29d91; --red: #e0876c; } }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--paper); color: var(--ink);
      font: 18px/1.6 "Source Serif 4", Georgia, serif; -webkit-font-smoothing: antialiased;
    }
    main { padding: 2rem; max-width: 28rem; }
    .rule { height: 5px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }
    h1 { margin: 1rem 0 .25rem; font-size: 1.6rem; font-weight: 600; }
    p { margin: 0 0 1rem; color: var(--muted); }
    a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: .18em; }
  </style>
</head>
<body>
  <main>
    <div class="rule" aria-hidden="true"></div>
    <h1>Page not found</h1>
    <p>There's no entry for this address.</p>
    <p><a href="/">Back to the front page</a></p>
  </main>
</body>
</html>
